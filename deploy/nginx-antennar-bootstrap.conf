server {
    listen 80;
    listen [::]:80;
    server_name antennar.ftnsa.com;
    root /var/www/antennar.ftnsa.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
