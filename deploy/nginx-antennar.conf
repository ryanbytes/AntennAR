server {
    listen 80;
    listen [::]:80;
    server_name antennar.ftnsa.com;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://antennar.ftnsa.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name antennar.ftnsa.com;
    root /var/www/antennar.ftnsa.com;
    index index.html;
    access_log off;
    gzip_vary on;

    ssl_certificate /etc/letsencrypt/live/antennar.ftnsa.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/antennar.ftnsa.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control "public, max-age=0, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), accelerometer=(self), gyroscope=(self), magnetometer=(self)" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* \.json$ {
        gzip_static on;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
